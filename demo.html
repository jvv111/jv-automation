<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JV Automation – Chatbot Demo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&family=Outfit:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary:    #0D0B08;
      --bg-secondary:  #141210;
      --bg-card:       #1A1815;
      --bg-card-hover: #211E1A;
      --text-primary:  #E8E4DF;
      --text-secondary:#A39E96;
      --text-muted:    #6B6055;
      --accent:        #B8845C;
      --accent-hover:  #C99570;
      --border:        rgba(232, 228, 223, 0.08);
      --border-hover:  rgba(232, 228, 223, 0.15);
      --font-body:     'DM Sans', -apple-system, sans-serif;
      --font-heading:  'Instrument Serif', Georgia, serif;
      --radius-md:     12px;
      --radius-lg:     20px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .chat-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      height: 82vh;
      max-height: 720px;
    }

    /* Header */
    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-secondary);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: transparent;
    }

    .avatar .j { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; color: #C87941; line-height: 1; }
    .avatar .v { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; color: #ffffff; line-height: 1; }

    .chat-header-text h2 {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 400;
      color: var(--text-primary);
    }

    .chat-header-text p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .demo-badge {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--text-muted) transparent;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

    .message {
      max-width: 82%;
      line-height: 1.6;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
    }

    .message.bot a {
      color: var(--accent);
      text-decoration: underline;
    }

    .message.bot ul, .message.bot ol {
      padding-left: 18px;
      margin: 6px 0;
    }

    .message.bot li {
      margin-bottom: 4px;
    }

    .message.bot p {
      margin-bottom: 6px;
    }

    .message.bot strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #0D0B08;
      font-weight: 500;
      border-radius: var(--radius-md) 4px var(--radius-md) var(--radius-md);
    }

    .message.loading {
      align-self: flex-start;
      background: var(--bg-card-hover);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
      font-style: italic;
      font-size: 13px;
    }

    /* Input area */
    .chat-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      background: var(--bg-secondary);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }

    .chat-input-area input {
      flex: 1;
      padding: 11px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      font-size: 14px;
      color: var(--text-primary);
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input-area input::placeholder {
      color: var(--text-muted);
    }

    .chat-input-area input:focus {
      border-color: var(--accent);
    }

    .chat-input-area button {
      background: var(--accent);
      color: #0D0B08;
      border: none;
      border-radius: 24px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      transition: background 0.2s;
      white-space: nowrap;
    }

    .chat-input-area button:hover {
      background: var(--accent-hover);
    }

    .chat-input-area button:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">

    <div class="chat-header">
      <div class="avatar">
        <span class="j">J</span><span class="v">V</span>
      </div>
      <div class="chat-header-text">
        <h2>JV Automation Assistent</h2>
        <p>Stel gerust een vraag over de training</p>
      </div>
      <span class="demo-badge">DEMO</span>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        Hoi! Ik ben de assistent van JV Automation. Heb je een vraag over de AI training van Jop? Ik help je graag verder!
      </div>
    </div>

    <div class="chat-input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Stel een vraag..."
        autocomplete="off"
      />
      <button id="sendBtn" onclick="sendMessage()">Verstuur</button>
    </div>

  </div>

  <script>
    // Gespreksgeschiedenis bijhouden
    const messages = [];

    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('userInput');
    const sendBtn    = document.getElementById('sendBtn');

    // Verstuur met Enter
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Markdown naar HTML (basis: bold, links, bullets)
    function renderMarkdown(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\[(.+?)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/^[\*\-] (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>(\n|$))+/g, (match) => `<ul>${match}</ul>`)
        .replace(/\n\n/g, '</p><p>')
        .replace(/^(?!<[uol]|<p)(.+)$/gm, '<p>$1</p>');
    }

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      if (role === 'bot') {
        div.innerHTML = renderMarkdown(text);
      } else {
        div.textContent = text;
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      sendBtn.disabled = true;

      addMessage(text, 'user');
      messages.push({ role: 'user', content: text });

      const loadingEl = addMessage('Bezig met typen...', 'loading');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();
        loadingEl.remove();

        if (data.reply) {
          addMessage(data.reply, 'bot');
          messages.push({ role: 'assistant', content: data.reply });
        } else if (data.error === 'rate_limit') {
          addMessage('Door hoog verbruik is de assistent tijdelijk niet beschikbaar. Probeer het over een paar minuten opnieuw.', 'bot');
        } else {
          addMessage('Er ging iets mis. Probeer het opnieuw.', 'bot');
        }

      } catch (err) {
        loadingEl.remove();
        addMessage('Er ging iets mis. Controleer de verbinding.', 'bot');
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }
  </script>
</body>
</html>
