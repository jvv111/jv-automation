<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JV Automation – Chatbot Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-wrapper {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      height: 80vh;
      max-height: 700px;
    }

    .chat-header {
      background: #1a1a2e;
      color: white;
      padding: 20px 24px;
      border-radius: 16px 16px 0 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .avatar {
      width: 40px;
      height: 40px;
      background: #e85d26;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .chat-header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-header p {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 2px;
    }

    .demo-badge {
      margin-left: auto;
      background: #e85d26;
      color: white;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.bot {
      align-self: flex-start;
      background: #f0f0f0;
      color: #1a1a2e;
      padding: 12px 16px;
      border-radius: 4px 16px 16px 16px;
    }

    .message.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: white;
      padding: 12px 16px;
      border-radius: 16px 4px 16px 16px;
    }

    .message.loading {
      align-self: flex-start;
      background: #f0f0f0;
      color: #999;
      padding: 12px 16px;
      border-radius: 4px 16px 16px 16px;
      font-style: italic;
    }

    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .chat-input-area input:focus {
      border-color: #1a1a2e;
    }

    .chat-input-area button {
      background: #e85d26;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    .chat-input-area button:hover {
      background: #c94d1e;
    }

    .chat-input-area button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <div class="avatar">JV</div>
      <div>
        <h2>JV Automation Assistent</h2>
        <p>Stel gerust een vraag over de trainingen</p>
      </div>
      <span class="demo-badge">DEMO</span>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        Hoi! Ik ben de assistent van JV Automation. Heb je een vraag over onze AI trainingen? Ik help je graag verder!
      </div>
    </div>

    <div class="chat-input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Stel een vraag..."
        autocomplete="off"
      />
      <button id="sendBtn" onclick="sendMessage()">Verstuur</button>
    </div>
  </div>

  <script>
    const messages = [];

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      sendBtn.disabled = true;

      addMessage(text, 'user');
      messages.push({ role: 'user', content: text });

      const loadingEl = addMessage('Bezig met typen...', 'loading');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();

        loadingEl.remove();

        if (data.reply) {
          addMessage(data.reply, 'bot');
          messages.push({ role: 'assistant', content: data.reply });
        } else {
          addMessage('Er ging iets mis. Probeer het opnieuw.', 'bot');
        }

      } catch (err) {
        loadingEl.remove();
        addMessage('Er ging iets mis. Controleer de verbinding.', 'bot');
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }
  </script>
</body>
</html>
